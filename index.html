<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Birthday Tank Battle LV3</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --g: #e8e8e8;
      --dim: #9a9a9a;
      --muted: #7f7f7f;
      --b: #3a3a3a;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      font-family: 'SFMono-Regular', Consolas, Menlo, 'Fira Code', monospace
    }

    body {
      display: flex;
      overflow: auto;
      padding: clamp(12px, 4vw, 24px)
    }

    .win {
      width: min(680px, 92vw);
      margin: auto;
      border: 1px solid var(--b);
      background: var(--bg)
    }

    .bar {
      background: var(--b);
      padding: 6px 10px 6px 14px;
      color: var(--muted);
      font-size: clamp(11px, 2.5vw, 12.5px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .bar div {
      display: flex;
      gap: 6px
    }

    .tbtn {
      font: inherit;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--muted);
      padding: 2px 8px;
      cursor: pointer
    }

    .tbtn:hover,
    .tbtn:focus-visible {
      color: var(--g);
      border-color: var(--g)
    }

    .body {
      padding: clamp(18px, 4vw, 28px);
      min-height: clamp(260px, 52vh, 420px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--g);
      font-size: clamp(13.5px, 3.6vw, 16px);
      line-height: 1.7;
      text-align: center
    }

    .step {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      position: relative
    }

    .step.active {
      display: flex
    }

    .banner {
      white-space: pre;
      font-size: clamp(10px, 2.6vw, 13px);
      line-height: 1.25;
      margin: 0
    }

    .btn {
      font: inherit;
      font-size: clamp(13px, 3.2vw, 15px);
      color: var(--g);
      background: transparent;
      border: 1px solid var(--g);
      padding: 10px 22px;
      letter-spacing: 1px;
      cursor: pointer
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--g);
      color: #0c0c0c
    }

    .pulse {
      animation: pulse 1.1s ease-in-out infinite
    }

    @keyframes pulse {
      50% {
        opacity: .45
      }
    }

    .hint {
      color: var(--muted);
      font-size: clamp(10.5px, 2.6vw, 12px)
    }

    .track {
      width: min(260px, 70vw);
      height: 6px;
      background: #161616
    }

    .fill {
      height: 100%;
      width: 0;
      background: var(--g)
    }

    .field {
      container-type: inline-size;
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 4/3;
      border: 2px solid var(--b);
      overflow: hidden;
      box-shadow: inset 0 0 0 6px #060606
    }

    .field::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px);
      pointer-events: none
    }

    .tank {
      position: absolute;
      margin: 0;
      white-space: pre;
      font-size: clamp(8px, 2.3vw, 11px);
      font-size: 2.7cqw;
      line-height: 1.1;
      transform: translate(-50%, -50%)
    }

    .bullet {
      position: absolute;
      font-weight: 700;
      font-size: clamp(12px, 3vw, 16px);
      text-shadow: 0 0 3px var(--g);
      transform: translate(-50%, -50%)
    }

    .bullet::after {
      content: '';
      position: absolute;
      left: 50%;
      width: 2px;
      height: 16px;
      transform: translateX(-50%)
    }

    .dir-down::after {
      bottom: 100%;
      background: linear-gradient(to top, var(--g), transparent)
    }

    .dir-up::after {
      top: 100%;
      background: linear-gradient(to bottom, var(--g), transparent)
    }

    .particle {
      position: absolute;
      font-size: clamp(10px, 2.6vw, 14px);
      transform: translate(-50%, -50%);
      transition: left 2s ease-out, top 2s ease-out, opacity 2s ease-out;
      pointer-events: none
    }

    .hud {
      width: 100%;
      max-width: 420px;
      text-align: left;
      font-size: clamp(11px, 2.8vw, 13px);
      line-height: 1.5;
      white-space: pre;
      color: var(--dim)
    }

    .pad {
      display: flex;
      width: 100%;
      max-width: 420px;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none
    }

    @media (pointer:coarse),
    (hover:none),
    (max-width:820px) {
      .pad {
        display: flex
      }
    }

    .pad.on {
      display: flex !important
    }

    .pad.off {
      display: none !important
    }

    .step:not(.won) .pad {
      display: flex !important
    }

    .step.won .pad {
      display: none !important
    }

    .dpad {
      width: min(150px, 38vw);
      aspect-ratio: 1;
      border: 1px solid var(--muted);
      display: grid;
      grid-template: repeat(3, 1fr)/repeat(3, 1fr);
      place-items: center;
      color: var(--muted);
      touch-action: none
    }

    .dpad i {
      font-style: normal;
      font-size: clamp(18px, 5.5vw, 24px);
      line-height: 1
    }

    .dpad i.a {
      color: var(--g)
    }

    .dpad .u {
      grid-area: 1/2
    }

    .dpad .l {
      grid-area: 2/1
    }

    .dpad .r {
      grid-area: 2/3
    }

    .dpad .d {
      grid-area: 3/2
    }

    .pad .fire {
      font: inherit;
      width: min(96px, 26vw);
      aspect-ratio: 1;
      color: var(--g);
      background: transparent;
      border: 1px solid var(--g);
      letter-spacing: 1px;
      touch-action: none
    }

    .pad .fire.a {
      background: var(--g);
      color: #0c0c0c
    }

    body {
      touch-action: manipulation
    }

    /* ===== Màn chúc mừng nằm CÙNG màn với trận đấu: chỉ đổi nội dung (lúc lớp trắng vụ nổ đã phủ kín) ===== */
    .final {
      display: none;
      position: relative;
      width: 100%;
      container-type: inline-size
    }

    .step.won .final {
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .step.won .field,
    .step.won .hud,
    .step.won .hint,
    .step.won .pad {
      display: none !important
    }

    /* Bánh: ẩn cho đến khi bắt đầu hạ; hạ từ mép trên của trang xuống đúng vị trí này (xem dropCake) */
    .cake {
      margin: 0 auto 6px;
      width: max-content;
      font-size: clamp(7px, 2.4vw, 12px);
      font-size: min(16px, 4.1cqw);
      line-height: 1.2;
      white-space: pre;
      position: relative;
      z-index: 2;
      visibility: hidden;
      will-change: transform
    }

    .cake.drop {
      visibility: visible;
    }

    .final {
      overflow: visible;
    }

    .final .cake {
      transform: translateY(-110vh);
    }

    .cake .flame {
      display: inline-block;
      position: relative;
      transform-origin: 50% 100%;
      animation: candleSway .24s ease-in-out infinite alternate !important;
      will-change: transform, opacity;
    }

    @keyframes candleSway {
      0%   { transform: rotate(-28deg) translateX(-2px) scaleX(.72) scaleY(.88); opacity: .65; }
      50%  { transform: rotate(0deg) translateX(0) scaleX(1.15) scaleY(1.15); opacity: 1; }
      100% { transform: rotate(28deg) translateX(2px) scaleX(.72) scaleY(.88); opacity: .7; }
    }

    .fw {
      position: absolute;
      inset: -20px -10px;
      pointer-events: none;
      overflow: visible;
      z-index: 3
    }

    .wish {
      width: 100%;
      text-align: left;
      font-size: clamp(13px, 3.4vw, 15px);
      line-height: 1.85;
      position: relative;
      white-space: pre-wrap
    }

    .final .btn {
      margin-top: 14px
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: var(--g);
      vertical-align: text-bottom;
      margin-left: 4px;
      animation: blink 1s step-end infinite
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    /* Vụ nổ lan toàn màn hình */
    .boom {
      position: fixed;
      inset: 0;
      z-index: 99;
      pointer-events: none;
      overflow: hidden
    }

    .boom .ring {
      position: absolute;
      border-radius: 50%;
      width: 100px;
      height: 100px;
      margin: -50px 0 0 -50px;
      will-change: transform
    }

    .boom .deb {
      position: absolute;
      color: #0c0c0c;
      font-weight: 700;
      text-shadow: 0 0 4px #fff, 0 0 9px #fff
    }

    .cake .flame:nth-of-type(2) { animation-delay: -.08s !important; }
    .cake .flame:nth-of-type(3) { animation-delay: -.16s !important; }
    .cake .flame:nth-of-type(4) { animation-delay: -.04s !important; }
    .cake .flame:nth-of-type(5) { animation-delay: -.20s !important; }

    @media (prefers-reduced-motion:reduce) {

      .cursor,
      .pulse {
        animation: none
      }

      .particle {
        transition: none
      }
    }
  </style>
</head>

<body>
  <div class="win">
    <div class="bar"><span>C:\Users\Guest&gt;</span>
      <div><button class="tbtn" id="padBtn">[ PAD ]</button><button class="tbtn" id="pauseBtn">[ II ]</button><button
          class="tbtn" id="muteBtn">[ &#9834; ON ]</button></div>
    </div>
    <div class="body">
      <div class="step active" id="stepStart">
        <pre class="banner" id="banner"></pre>
        <button class="btn pulse" id="startBtn">&#9654; NHẤN ĐỂ BẮT ĐẦU</button>
        <div class="hint">(bật âm thanh để có trải nghiệm đầy đủ)</div>
      </div>
      <div class="step" id="stepLoading">
        <div id="loadLabel"></div>
        <div class="track">
          <div class="fill" id="fill"></div>
        </div>
        <div class="hint" id="pct">0%</div>
      </div>
      <div class="step" id="stepBattle">
        <div class="field" id="field">
          <pre class="tank" id="tankTop"></pre>
          <pre class="tank" id="tankBottom"></pre>
        </div>
        <div class="hud" id="hud"></div>
        <div class="hint" id="hint"></div>
        <div class="pad">
          <div class="dpad" id="dpad"><i class="u" data-d="up">&uarr;</i><i class="l" data-d="left">&larr;</i><i
              class="r" data-d="right">&rarr;</i><i class="d" data-d="down">&darr;</i></div>
          <button class="fire" id="fireBtn">FIRE</button>
        </div>
        <div class="final" id="final">
          <div class="fw" id="fw"></div>
          <pre class="cake" id="finalCake"></pre>
          <div class="wish" id="wish"></div>
          <button class="btn" id="replay" style="visibility:hidden">[ CHƠI LẠI ]</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // ===== CONFIG (đơn vị: % sân, giây) =====
    const CONFIG = {
      userName: 'Duyên',
      battle: {
        playerHp: 100, enemyHp: 100, playerSpeed: 45, enemySpeed: 24, playerFireRate: .7, enemyFireRate: 1.4,
        playerBulletSpeed: 95, enemyBulletSpeed: 65, playerBulletDamage: 50, enemyBulletDamage: 50, rammingDamage: 25
      },
      respawn: { delay: 1.5, invulnerability: 1.8 },
      birthday: {
        music: 'the_mountain-happy-birthday-576570.mp3',  // đặt cùng thư mục với file HTML
        dropMs: 4500,       // thời gian bánh hạ từ mép trên trang xuống vị trí cuối (ms)
        typeSpeed: 70,      // ms mỗi ký tự (càng lớn càng chậm)
        lineDelay: 800,    // ms nghỉ giữa các dòng
        message: [
          '> Chúc mừng sinh nhật {name}!',
          '> Chúc bạn tuổi mới thật nhiều sức khỏe.',
          '> Chúc cho mọi điều tốt đẹp nhất sẽ luôn đến với bạn',
          '> bằng một cách dễ dàng nhất!']
      }
    };
    const D = CONFIG.birthday.dropMs, T = 2800;
    const $ = id => document.getElementById(id);
    const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const HINT = matchMedia('(pointer:coarse)').matches ? 'Vòng trái: di chuyển · FIRE: bắn (giữ để bắn liên tục)' : 'WASD / mũi tên: di chuyển · SPACE: bắn · P: tạm dừng';

    // ===== ART =====
    $('banner').textContent =
      "  _   _    ____   \n | | | |  |  _ \\  \n | |_| |  | |_) | \n |  _  |  |  __/  \n |_| |_|  |_|     \n  H A P P Y  B I R T H D A Y";
    // Bánh 3 tầng: mọi dòng có độ dài lẻ và được canh giữa trong CAKE_W lẻ => đối xứng trái/phải tuyệt đối
    const CAKE_W = 39, cpad = t => ' '.repeat((CAKE_W - t.length) / 2) + t + ' '.repeat((CAKE_W - t.length) / 2);
    const spell = t => t.split('').join(' ');   // 2n-1 ký tự => luôn lẻ, tên dài/ngắn đều canh giữa chuẩn
    function buildCake(flame) {
      const tier = (w, text) => {
        const i = w - 2, sp = ' '.repeat((i - text.length) / 2);
        return [cpad('.-' + '~'.repeat(w - 4) + '-.'),
        cpad('|' + Array.from({ length: i }, (_, k) => k % 4 ? ' ' : 'v').join('') + '|'),
        cpad('|' + sp + text + sp + '|'),
        cpad('|' + '_'.repeat(i) + '|')];
      };
      return [cpad('§  §  §  §  §'), cpad('|  |  |  |  |'),
      ...tier(19, spell('HAPPY')), ...tier(27, spell('BIRTHDAY')),
      ...tier(35, spell(CONFIG.userName.normalize('NFC').slice(0, 12).toUpperCase())),
      cpad('(' + '='.repeat(CAKE_W - 2) + ')'), cpad('\\' + '_'.repeat(CAKE_W - 2) + '/')]
        .join('\n').replace(/§/g, flame ? '<span class="flame">o</span>' : 'o');
    }
    $('finalCake').innerHTML = buildCake(true);

    // Mọi dòng dài đúng W = n + 12 => tank đối xứng tuyệt đối với tên bất kỳ (nòng '||' khi W chẵn, '|' khi W lẻ)
    function tankArt(inner, down) {
      const n = inner.length, W = n + 12, gun = '|'.repeat(W % 2 ? 1 : 2), sp = k => ' '.repeat(k);
      const mid = t => sp((W - t.length) / 2) + t + sp((W - t.length) / 2), u = '_'.repeat(n);
      const tread = ' O==O' + sp(n + 2) + 'O==O ', hull = '|____|' + u + '|____|', body = '|   |' + u + '__|   |';
      return (down
        ? [tread, hull, body, ' \\  =[' + inner + ']=  / ', '  \\_  ' + u + '  _/  ', mid('---' + gun + '---'), mid(gun)]
        : [mid(gun), mid('___' + gun + '___'), '  _/  ' + u + '  \\_  ', ' /  =[' + inner + ']=  \\ ', body, hull, tread]).join('\n');
    }
    const tankName = () => CONFIG.userName.normalize('NFC').slice(0, 8).toUpperCase();
    function sizeTanks() {   // hitbox = 82% khung ASCII thật, tính theo % sân => khớp mọi kích thước màn hình
      const fw = field.clientWidth, fh = field.clientHeight; if (!fw) return;
      [[tb, playerTank], [te, enemyTank]].forEach(([el, t]) => { el.style.display = 'block'; t.w = el.offsetWidth / fw * 82; t.h = el.offsetHeight / fh * 82; });
    }
    addEventListener('resize', sizeTanks);

    // ===== AUDIO =====
    let ac, mg, muted = false, bgOn = false, bgTimer;
    const bday = new Audio(CONFIG.birthday.music);   // nhạc sinh nhật từ file mp3
    bday.preload = 'auto'; bday.loop = true;
    function initAudio() {
      if (ac) return;
      ac = new (window.AudioContext || window.webkitAudioContext)();
      mg = ac.createGain(); mg.gain.value = muted ? 0 : .32; mg.connect(ac.destination);
    }
    function beep(f, d, t, v, dl) {
      if (!ac) return;
      const t0 = ac.currentTime + (dl || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = t || 'square'; o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(.0001, t0); g.gain.linearRampToValueAtTime(v || .18, t0 + .008); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      o.connect(g); g.connect(mg); o.start(t0); o.stop(t0 + d + .03);
    }
    function noise(d, v, cut) {
      if (!ac) return;
      const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), a = buf.getChannelData(0);
      for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = buf; f.type = 'lowpass'; f.frequency.value = cut || 1400; g.gain.value = v;
      s.connect(f); f.connect(g); g.connect(mg); s.start();
    }
    const AudioManager = {
      shoot() {
        if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square'; o.frequency.setValueAtTime(760, t); o.frequency.exponentialRampToValueAtTime(180, t + .14);
        g.gain.setValueAtTime(.14, t); g.gain.exponentialRampToValueAtTime(.0001, t + .15);
        o.connect(g); g.connect(mg); o.start(t); o.stop(t + .16);
      },
      hit() { beep(220, .1, 'square', .14); noise(.1, .15); },
      explosion() { noise(.45, .34); beep(90, .32, 'sawtooth', .2, .02); },
      bigExplosion() { noise(1.4, .6, 900); beep(60, .9, 'sawtooth', .28, .02); beep(38, 1.2, 'sine', .3, .05); },
      respawn() { [400, 600, 800].forEach((f, i) => beep(f, .09, 'square', .12, i * .08)); },
      blip() { beep(1300 + Math.random() * 260, .028, 'square', .03); }
    };
    const bgPat = [130.81, 0, 164.81, 0, 196, 164.81, 0, 0]; let bgI = 0;
    function bgLoop() { const f = bgPat[bgI++ % 8]; if (f) beep(f, .22, 'square', .07); bgTimer = setTimeout(bgLoop, 260); }
    function startBg() { if (bgOn) return; bgOn = true; bgLoop(); }
    function stopBg() { bgOn = false; clearTimeout(bgTimer); }
    function playBirthday() { bday.currentTime = 0; bday.muted = muted; bday.volume = 1; const p = bday.play(); if (p) p.catch(() => { }); }
    function stopBirthday() { bday.pause(); bday.currentTime = 0; }
    $('muteBtn').onclick = () => {
      muted = !muted; $('muteBtn').textContent = muted ? '[ \u266A OFF ]' : '[ \u266A ON ]';
      bday.muted = muted;
      if (mg) mg.gain.setTargetAtTime(muted ? 0 : .32, ac.currentTime, .01);
    };

    // ===== STATE / ENTITIES (không chứa DOM, trừ bullet.el để render) =====
    const mk = (id, x, y, sp, fr, hp) => ({
      id, x, y, w: 18, h: 22, vx: 0, vy: 0, speed: sp, hp, maxHp: hp, alive: true,
      fireCooldown: 0, fireRate: fr, spawnX: x, spawnY: y, invulnerable: false, invulnerableTime: 0
    });
    const B = CONFIG.battle;
    const playerTank = mk('player', 70, 78, B.playerSpeed, B.playerFireRate, B.playerHp);
    const enemyTank = mk('enemy', 30, 20, B.enemySpeed, B.enemyFireRate, B.enemyHp);
    enemyTank.ai = { state: 'PATROL', direction: 1, timer: 0, dir: 1 };
    const gameState = { phase: 'START', paused: false, bullets: [], respawn: { active: false, remaining: 0 }, winner: null };
    const input = { up: false, down: false, left: false, right: false, fire: false };
    const resetInput = () => Object.keys(input).forEach(k => input[k] = false);

    const field = $('field'), tb = $('tankBottom'), te = $('tankTop'), stepBattle = $('stepBattle'), cake = $('finalCake');
    const steps = ['stepStart', 'stepLoading', 'stepBattle'].map($);
    const goTo = el => { steps.forEach(s => s.classList.remove('active')); el.classList.add('active'); };
    const timers = [];
    const later = (f, ms) => timers.push(setTimeout(f, ms));

    // ===== INPUT (bàn phím + cảm ứng chỉ cập nhật `input`) =====
    const KEYS = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', Space: 'fire' };
    addEventListener('keydown', e => {
      if (e.code === 'KeyP') { togglePause(); return; }
      const k = KEYS[e.code]; if (k) { input[k] = true; e.preventDefault(); }
    });
    addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) input[k] = false; });
    const dpad = $('dpad'), fireBtn = $('fireBtn'), pad = document.querySelector('.pad');
    const dpadKeys = () => dpad.querySelectorAll('i').forEach(i => i.classList.toggle('a', input[i.dataset.d]));
    function dpadSet(e) {
      const r = dpad.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5, T = .16;
      input.left = x < -T; input.right = x > T; input.up = y < -T; input.down = y > T; dpadKeys();
    }
    dpad.addEventListener('pointerdown', e => { e.preventDefault(); dpad.setPointerCapture(e.pointerId); dpadSet(e); });
    dpad.addEventListener('pointermove', e => { if (dpad.hasPointerCapture(e.pointerId)) dpadSet(e); });
    ['pointerup', 'pointercancel'].forEach(t => dpad.addEventListener(t, () => { input.up = input.down = input.left = input.right = false; dpadKeys(); }));
    const fireSet = v => { input.fire = v; fireBtn.classList.toggle('a', v); };
    fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); fireBtn.setPointerCapture(e.pointerId); fireSet(true); });
    ['pointerup', 'pointercancel'].forEach(t => fireBtn.addEventListener(t, () => fireSet(false)));
    addEventListener('contextmenu', e => { if (e.target.closest('.pad')) e.preventDefault(); });
    $('padBtn').onclick = () => { pad.classList.remove('off'); pad.classList.add('on'); };
    function togglePause() {
      if (gameState.phase !== 'BATTLE') return;
      gameState.paused = !gameState.paused; resetInput();
      $('hint').textContent = gameState.paused ? '|| TẠM DỪNG — nhấn P để tiếp tục' : HINT;
    }
    $('pauseBtn').onclick = togglePause;

    // ===== PHYSICS / COLLISION =====
    const overlap = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
    function clampTank(t) {
      t.x = Math.max(t.w / 2 + 2, Math.min(98 - t.w / 2, t.x));
      t.y = Math.max(t.h / 2 + 2, Math.min(98 - t.h / 2, t.y));
    }
    function burst(host, x, y, n, d, ms) {
      n = Math.ceil(n * (RM ? .4 : 1));
      const ch = '*+.#xo';
      for (let i = 0; i < n; i++) {
        const p = document.createElement('div');
        p.className = 'particle'; p.textContent = ch[Math.random() * ch.length | 0];
        p.style.left = x + '%'; p.style.top = y + '%'; host.appendChild(p); void p.offsetWidth;
        const a = Math.random() * 6.283, r = d * (.5 + Math.random() * .5);
        requestAnimationFrame(() => { p.style.left = x + Math.cos(a) * r + '%'; p.style.top = y + Math.sin(a) * r * .75 + '%'; p.style.opacity = 0; });
        setTimeout(() => p.remove(), ms || 2100);
      }
    }

    // ===== COMBAT =====
    function fireBullet(t) {
      const p = t.id === 'player';
      const b = {
        owner: t.id, x: t.x, y: t.y + (p ? -1 : 1) * (t.h / 2 + 1), vx: 0, vy: (p ? -B.playerBulletSpeed : B.enemyBulletSpeed),
        w: 3, h: 6, damage: p ? B.playerBulletDamage : B.enemyBulletDamage, alive: true, life: 2.5, seen: false
      };
      const el = document.createElement('div');
      el.className = 'bullet ' + (p ? 'dir-up' : 'dir-down'); el.textContent = p ? '^' : 'v';
      field.appendChild(el); b.el = el; gameState.bullets.push(b); AudioManager.shoot();
    }
    function damagePlayer(d) {
      const p = playerTank;
      if (!p.alive || p.invulnerable) return;
      p.hp = Math.max(0, p.hp - d); AudioManager.hit(); burst(field, p.x, p.y, 8, 12, 900);
      if (p.hp <= 0) killPlayer();
    }
    function killPlayer() {
      const p = playerTank;
      p.hp = 0; p.alive = false; p.vx = p.vy = 0;
      gameState.respawn = { active: true, remaining: CONFIG.respawn.delay };
      AudioManager.explosion(); burst(field, p.x, p.y, 22, 22, 1400);
    }
    function respawnPlayer() {
      const p = playerTank;
      Object.assign(p, { x: p.spawnX, y: p.spawnY, vx: 0, vy: 0, hp: p.maxHp, alive: true, invulnerable: true, invulnerableTime: CONFIG.respawn.invulnerability });
      gameState.respawn.active = false; AudioManager.respawn();
    }

    // ===== CONTROLLERS =====
    function updatePlayer(dt) {
      const p = playerTank; if (!p.alive) return;
      p.vx = (input.right - input.left) * p.speed; p.vy = (input.down - input.up) * p.speed;
      p.x += p.vx * dt; p.y += p.vy * dt; clampTank(p);
      if (input.fire && p.fireCooldown <= 0) { fireBullet(p); p.fireCooldown = p.fireRate; }
    }
    function updateEnemy(dt) {
      const e = enemyTank, p = playerTank, a = e.ai; if (!e.alive) return;
      const dx = p.x - e.x, ad = p.alive ? Math.abs(dx) : 99;
      const danger = gameState.bullets.find(b => b.owner === 'player' && b.alive && b.y > e.y && b.y - e.y < 50 && Math.abs(b.x - e.x) < e.w / 2 + 4);
      if (danger && !danger.seen) {                        // mỗi viên đạn: ~50% enemy kịp phát hiện và né
        danger.seen = true;
        if (Math.random() < .5) { a.state = 'DODGE'; a.timer = .5; a.dir = danger.x >= e.x ? -1 : 1; }
      }
      if (a.state === 'DODGE') { e.vx = a.dir * e.speed * 2; if ((a.timer -= dt) <= 0) a.state = 'PATROL'; }
      else if (ad < 8) { a.state = 'ATTACK'; e.vx = 0; }
      else if (ad < 28 && e.fireCooldown < .5) { a.state = 'AIM'; e.vx = Math.sign(dx) * e.speed * .7; }
      else { a.state = 'PATROL'; e.vx = a.direction * e.speed; }
      e.x += e.vx * dt; clampTank(e);
      if (e.x <= e.w / 2 + 2.5) a.direction = 1;
      if (e.x >= 97.5 - e.w / 2) a.direction = -1;
      if (e.fireCooldown <= 0 && (a.state === 'ATTACK' || Math.random() < .01)) {
        fireBullet(e); e.fireCooldown = e.fireRate * (.8 + Math.random() * .6);
      }
    }
    function updateBullets(dt) {
      for (const b of gameState.bullets) {
        b.x += b.vx * dt; b.y += b.vy * dt;
        if ((b.life -= dt) <= 0 || b.y < -5 || b.y > 105) b.alive = false;
      }
    }
    function resolveBulletVsTank() {
      for (const b of gameState.bullets) {
        if (!b.alive) continue;
        if (b.owner === 'player' && enemyTank.alive && overlap(b, enemyTank)) {
          enemyTank.hp = Math.max(0, enemyTank.hp - b.damage); b.alive = false;
          AudioManager.hit(); burst(field, enemyTank.x, enemyTank.y, 10, 14, 900);
        } else if (b.owner === 'enemy' && playerTank.alive && overlap(b, playerTank)) {
          b.alive = false; damagePlayer(b.damage);
        }
      }
    }
    function resolveBulletVsBullet() {
      const bs = gameState.bullets.filter(b => b.alive);
      for (const a of bs) for (const c of bs) {
        if (a.alive && c.alive && a.owner === 'player' && c.owner === 'enemy' && overlap(a, c)) {
          a.alive = c.alive = false; AudioManager.hit(); burst(field, a.x, a.y, 6, 8, 800);
        }
      }
    }
    function resolveTankVsTank() {
      const p = playerTank, e = enemyTank;
      if (!(p.alive && e.alive && overlap(p, e))) return;
      if (p.invulnerable) { p.y = e.y + (e.h + p.h) / 2 + .5; clampTank(p); return; }
      e.hp = Math.max(0, e.hp - B.rammingDamage); burst(field, e.x, e.y, 10, 14, 900); killPlayer();
    }
    function updateCooldowns(dt) {
      for (const t of [playerTank, enemyTank]) t.fireCooldown = Math.max(0, t.fireCooldown - dt);
    }
    function updateRespawn(dt) {
      const p = playerTank;
      if (p.invulnerable && (p.invulnerableTime -= dt) <= 0) p.invulnerable = false;
      if (gameState.respawn.active && (gameState.respawn.remaining -= dt) <= 0) respawnPlayer();
    }
    function cleanupEntities() {
      gameState.bullets = gameState.bullets.filter(b => { if (!b.alive) b.el.remove(); return b.alive; });
    }
    function checkVictory() {
      if (enemyTank.alive && enemyTank.hp <= 0) {
        enemyTank.alive = false; gameState.phase = 'VICTORY'; gameState.winner = 'player';
        onEnemyDestroyed();
      }
    }
    function update(dt) {
      updatePlayer(dt); updateEnemy(dt); updateBullets(dt);
      resolveBulletVsTank(); resolveBulletVsBullet(); resolveTankVsTank();
      updateCooldowns(dt); updateRespawn(dt); checkVictory(); cleanupEntities();
    }

    // ===== RENDER =====
    const bar = (h, m) => { const n = Math.round(h / m * 10); return '█'.repeat(n) + '░'.repeat(10 - n); };
    function render() {
      const p = playerTank, e = enemyTank;
      tb.style.display = p.alive ? 'block' : 'none';
      if (p.alive) {
        tb.style.left = p.x + '%'; tb.style.top = p.y + '%';
        tb.style.opacity = p.invulnerable && Math.floor(p.invulnerableTime * 8) % 2 ? .35 : 1;
      }
      te.style.display = e.alive ? 'block' : 'none';
      te.style.left = e.x + '%'; te.style.top = e.y + '%';
      for (const b of gameState.bullets) { b.el.style.left = b.x + '%'; b.el.style.top = b.y + '%'; }
      $('hud').textContent = 'BẠN  ' + bar(p.hp, p.maxHp) + ' ' + p.hp + '\nĐỊCH ' + bar(e.hp, e.maxHp) + ' ' + e.hp;
    }

    // ===== VỤ NỔ LAN TOÀN MÀN HÌNH: bắt đầu từ tâm xe tăng địch (toạ độ màn hình) =====
    function screenBoom(cx, cy) {
      const o = document.createElement('div'); o.className = 'boom'; document.body.appendChild(o);
      const R = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy)), k = R / 50 * 1.15;
      const ring = (bg, delay, dur, glow) => {
        const r = document.createElement('div'); r.className = 'ring';
        r.style.left = cx + 'px'; r.style.top = cy + 'px'; r.style.background = bg; if (glow) r.style.boxShadow = glow;
        o.appendChild(r);
        r.animate([{ transform: 'scale(.05)' }, { transform: 'scale(' + k + ')' }],
          { duration: dur, delay, easing: 'cubic-bezier(.15,.7,.25,1)', fill: 'both' });
      };
      ring('radial-gradient(circle,#fff 0,#fff 55%,#bdbdbd 78%,#6a6a6a 100%)', 0, 1500, '0 0 40px 20px rgba(255,255,255,.7)');
      ring('radial-gradient(circle,#fff 0,#e8e8e8 50%,#fff 100%)', 250, 1300);
      const n = RM ? 24 : 70, ch = '*+.#xo@';
      for (let i = 0; i < n; i++) {                       // mảnh vỡ bắn ra mọi hướng
        const d = document.createElement('div'); d.className = 'deb'; d.textContent = ch[Math.random() * ch.length | 0];
        d.style.left = cx + 'px'; d.style.top = cy + 'px'; d.style.fontSize = (12 + Math.random() * 22) + 'px'; o.appendChild(d);
        const a = Math.random() * 6.283, dist = R * (.35 + Math.random() * .9);
        d.animate([
          { transform: 'translate(-50%,-50%) translate(0,0) rotate(0deg)', opacity: 1 },
          { transform: 'translate(-50%,-50%) translate(' + Math.cos(a) * dist + 'px,' + Math.sin(a) * dist + 'px) rotate(' + (Math.random() * 720 - 360) + 'deg)', opacity: 0 }
        ], { duration: 900 + Math.random() * 900, easing: 'ease-out', fill: 'forwards' });
      }
      if (!RM) document.querySelector('.win').animate([
        { transform: 'translate(0,0)' }, { transform: 'translate(-8px,5px)' }, { transform: 'translate(7px,-6px)' },
        { transform: 'translate(-5px,-4px)' }, { transform: 'translate(4px,5px)' }, { transform: 'translate(0,0)' }
      ], { duration: 600, iterations: 2 });
      later(() => { o.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1000, fill: 'forwards' }).onfinish = () => o.remove(); }, 1700);
    }

    // ===== VICTORY: nổ -> (đổi nội dung dưới lớp trắng) -> nhạc -> bánh hạ từ mép trên trang -> chữ gõ chậm =====
    let wishRows = [], cakeAnim = null;

    function stageBirthday() {
      gameState.phase = 'CAKE';
      stepBattle.classList.add('won');
      cake.classList.remove('drop');
      cake.style.transform = 'translateY(-110vh)';
      const box = $('wish'); box.innerHTML = '';
      wishRows = CONFIG.birthday.message.map(l => {
        const chars = Array.from(l.replace('{name}', CONFIG.userName));
        const d = document.createElement('div'), t = document.createElement('span'), g = document.createElement('span');
        g.style.visibility = 'hidden'; g.textContent = chars.join(''); d.append(t, g); box.appendChild(d);
        return { chars, t, g };
      });
    }

    // đăng ký một lần, đặt cạnh phần INPUT
    $('wish').addEventListener('click', () => {
      if (gameState.phase !== 'MESSAGE') return;
      timers.splice(0).forEach(clearTimeout);
      wishRows.forEach(r => { r.t.textContent = r.chars.join(''); r.g.textContent = ''; });
      wishRows[wishRows.length - 1].t.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
      gameState.phase = 'COMPLETE';
      $('replay').style.visibility = 'visible';
    });
    // function dropCake() {
    //   const r = cake.getBoundingClientRect();              // vị trí cuối (chưa dịch chuyển)
    //   cake.classList.add('drop');
    //   if (RM) return;
    //   const from = -(r.top + r.height + 24);               // đẩy bánh lên hẳn phía trên mép trên của trang
    //   cake.style.transform = 'translateY(' + from + 'px)';
    //   cakeAnim = cake.animate([
    //     { transform: 'translateY(' + from + 'px)', easing: 'cubic-bezier(.45,0,.25,1)' },   // khởi động nhẹ, giảm tốc êm khi gần tới
    //     { transform: 'translateY(5px)', offset: .9, easing: 'ease-out' },                    // lún nhẹ một chút
    //     { transform: 'translateY(0)' }                                                     // nảy về đúng chỗ
    //   ], { duration: CONFIG.birthday.dropMs, fill: 'both' });
    //   cakeAnim.onfinish = () => { cake.style.transform = ''; cakeAnim.cancel(); cakeAnim = null; };
    // }
    function dropCake() {
      if (cakeAnim) { cakeAnim.cancel(); cakeAnim = null; }
      cake.classList.add('drop');
      cake.style.transform = 'translateY(-110vh)';
      void cake.offsetWidth;
      cakeAnim = cake.animate([
        { transform: 'translateY(-110vh)' },
        { transform: 'translateY(8px)', offset: .88 },
        { transform: 'translateY(0)' }
      ], {
        duration: CONFIG.birthday.dropMs,
        easing: 'cubic-bezier(.3,.1,.3,1)',
        fill: 'both'
      });
      cakeAnim.onfinish = () => {
        cake.style.transform = 'translateY(0)';
        cakeAnim = null;
      };
    }
    function typeRow(row, sp, cb) {
      let i = 0;
      (function s() {
        if (i < row.chars.length) {
          const c = row.chars[i++];
          row.t.textContent = row.chars.slice(0, i).join(''); row.g.textContent = row.chars.slice(i).join('');
          if (c !== ' ') AudioManager.blip();
          later(s, sp);
        } else if (cb) cb();
      })();
    }
    function showWish() {
      gameState.phase = 'MESSAGE';
      const W = CONFIG.birthday; let i = 0;
      (function next() {
        typeRow(wishRows[i], W.typeSpeed, () => {
          if (++i < wishRows.length) return later(next, W.lineDelay);
          wishRows[i - 1].t.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
          gameState.phase = 'COMPLETE'; $('replay').style.visibility = 'visible';
          for (let k = 0; k < 6; k++) later(() => burst($('fw'), 10 + Math.random() * 80, 15 + Math.random() * 60, 12, 14, 1700), 400 + k * 1000);
        });
      })();
    }
    function onEnemyDestroyed() {
      const e = enemyTank, r = te.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      resetInput(); gameState.bullets.forEach(b => b.alive = false); cleanupEntities(); stopBg();
      te.style.display = 'none';
      AudioManager.bigExplosion(); burst(field, e.x, e.y, 28, 30); screenBoom(cx, cy);
      later(() => { AudioManager.explosion(); burst(field, e.x, e.y, 36, 60); }, 350);

      const D = CONFIG.birthday.dropMs, T = 2900;          // T: lúc bánh bắt đầu hạ (lớp trắng đang mờ dần)
      later(stageBirthday, 1600);                          // lớp trắng đã phủ kín => đổi nội dung
      later(playBirthday, 1700);                           // nhạc bật TRƯỚC
      later(dropCake, T);                                  // bánh bắt đầu hạ từ mép trên trang
      [T + 1500, T + 2700, T + 3900].forEach(t => later(() => burst($('fw'), 10 + Math.random() * 80, 10 + Math.random() * 60, 20, 30), t));
      later(showWish, T + D + 600);                        // bánh yên vị rồi mới hiện chữ
    }

    // ===== FLOW =====
    function resetGame() {
      timers.splice(0).forEach(clearTimeout);
      stopBirthday();
      if (cakeAnim) { cakeAnim.cancel(); cakeAnim = null; }
      const P = playerTank, E = enemyTank;
      Object.assign(P, { x: P.spawnX, y: P.spawnY, vx: 0, vy: 0, hp: P.maxHp, alive: true, invulnerable: false, invulnerableTime: 0, fireCooldown: 0 });
      Object.assign(E, { x: E.spawnX, y: E.spawnY, vx: 0, hp: E.maxHp, alive: true, fireCooldown: 1 });
      E.ai = { state: 'PATROL', direction: 1, timer: 0, dir: 1 };
      Object.assign(gameState, { bullets: [], paused: false, winner: null, respawn: { active: false, remaining: 0 } });
      field.querySelectorAll('.bullet,.particle').forEach(n => n.remove());
      document.querySelectorAll('.boom').forEach(n => n.remove());
      stepBattle.classList.remove('won'); cake.classList.remove('drop'); cake.style.transform = '';
      $('fw').innerHTML = ''; $('wish').innerHTML = ''; wishRows = []; $('replay').style.visibility = 'hidden';
      resetInput();
      tb.textContent = tankArt(tankName(), false); te.textContent = tankArt('#'.repeat(tankName().length), true); sizeTanks();
      $('hint').textContent = HINT; render();
    }
    function startBattle() { resetGame(); startBg(); gameState.phase = 'BATTLE'; }
    $('replay').onclick = startBattle;
    $('startBtn').onclick = () => {
      initAudio(); if (ac.state === 'suspended') ac.resume();
      // "mở khoá" phần tử audio trong lúc còn cử chỉ người dùng để nhạc mp3 tự phát được sau này
      bday.muted = true; const up = bday.play();
      if (up) up.then(() => { bday.pause(); bday.currentTime = 0; bday.muted = muted; }).catch(() => { bday.muted = muted; });
      beep(660, .12, 'square', .15); beep(990, .14, 'square', .15, .1);
      goTo($('stepLoading')); $('loadLabel').textContent = 'Đang khởi động cho ' + CONFIG.userName + '...';
      let p = 0;
      const iv = setInterval(() => {
        p += 5; $('fill').style.width = p + '%'; $('pct').textContent = p + '%';
        if (p >= 100) { clearInterval(iv); setTimeout(() => { goTo(stepBattle); startBattle(); }, 300); }
      }, 60);
    };

    // ===== GAME LOOP =====
    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, .05); last = now;
      if (gameState.phase === 'BATTLE' && !gameState.paused) { update(dt); render(); }
      requestAnimationFrame(loop);
    }
    resetGame(); requestAnimationFrame(loop);
  </script>
</body>
